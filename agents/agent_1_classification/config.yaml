# Model chọn 2026-11-23 (thử nghiệm Gemini). Precedence: explicit settings > AGENT_1_MODEL > GEMINI_MODEL > this file.
# API key: chỉ lấy từ GEMINI_API_KEY (root .env, gitignored; Compose truyền vào agent). Không ghi key trong code.
# gemini-3.5-flash-lite: ~1M token input, 65.536 token output (ai.google.dev/gemini-api/docs/models).
model: gemini-3.5-flash-lite
# Gemini generateContent options (integrations/external/gemini_client.py). max_completion_tokens -> maxOutputTokens
# (thinking tokens count toward it; a cut-off answer fails the job), reasoning_effort -> thinkingConfig.thinkingLevel
# (minimal | low | medium | high), stop -> stopSequences. temperature/top_p để trống: Google khuyên giữ mặc định với Gemini 3.
# Agent 1 tách nguyên văn từng chunk (mặc định 512 token): 32k đủ cho clause + facts + thinking.
inference_config:
  max_completion_tokens: 32000
  reasoning_effort: medium
  temperature:
  top_p:
