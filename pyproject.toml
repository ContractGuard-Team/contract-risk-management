[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-risk-management"
version = "0.1.0"
description = "Three-agent contract analysis base with Hermes and OpenAI"
requires-python = ">=3.11,<3.15"
dependencies = ["boto3>=1.34.59,<2", "httpx>=0.27,<1", "PyYAML>=6,<7",
                "langgraph>=1.2.19,<2", "python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
                "pypdf>=6,<7", "pypdfium2>=5,<6", "python-docx>=1.2,<2", "Pillow>=12,<13"]

[project.optional-dependencies]
test = ["moto[s3,sqs,dynamodb,secretsmanager,ssm]>=5,<6", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
include = ["agents*", "common*", "config", "integrations*", "orchestration*", "monitoring*", "input_processing*", "mcp_server*", "rag*", "scripts*", "workers*"]
exclude = ["agents.hermes.hermes_agent*", "tests*"]

[tool.setuptools.package-data]
"agents.shared" = ["prompts/*.md"]
"agents.agent_1_classification" = ["*.yaml", "*.md", "prompts/*.md", "context/*.md"]
"agents.agent_2_risk_scoring" = ["*.yaml", "*.md", "prompts/*.md", "context/*.md"]
"agents.agent_3_recommendation" = ["*.yaml", "*.md", "prompts/*.md", "context/*.md"]
